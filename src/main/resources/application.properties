spring.application.name=dassco-specify-adapter
spring.servlet.multipart.enabled=true

server.port=8081

management.endpoint.health.probes.enabled=true

auth.keycloak.realm=${KEYCLOAK_REALM:dassco}
auth.serverRootUrl=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8083/keycloak/}
auth.clientName=${KEYCLOAK_RESOURCE:dassco-asset-service}
auth.serverUrl=${auth.serverRootUrl}realms/${auth.keycloak.realm}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth.serverUrl}/protocol/openid-connect/certs

file-proxy.rootUrl=${FILE_PROXY_ROOT_URL:http://localhost:8080}
specify-bridge.rootUrl=${SPECIFY_BRIDGE_ROOT_URL:http://localhost:8080}


amqp-config.acknowledgeQueueName=${AMQP_ACKNOWLEDGE_QUEUE:acknowledge-queue}
amqp-config.assetQueueName=${AMQP_ASSET_QUEUE:asset-queue}
amqp-config.specifyArsSyncQueueName=${SPECIFY_ARS_SYNC_QUEUE:ars_specify_sync}
amqp-config.specifyArsSyncAcknowledgeQueueName=${SPECIFY_ARS_ACKNOWLEDGE_QUEUE:specify_ars_acknowledge}
amqp-config.host=${AMQP_HOST_NAME:localhost}
amqp-config.secure=${AMQP_SECURE:false}

# This is required for use with the Web Portal.
# Enables the 'getfileref' and '/static/...' URLs.
# web asset service settings.py -> ALLOW_STATIC_FILE_ACCESS = True
specify-web-asset-service.allowStaticFileAccess=${SPECIFY_WEB_ASSET_SERVICE_ALLOW_STATIC_FILE_ACCESS:true}
specify-web-asset-service.fileFriendlyPostfix=${SPECIFY_WEB_ASSET_SERVICE_FILE_FRIENDLY_POSTFIX:specify-001}
specify-web-asset-service.tokenKey=${SPECIFY_WEB_ASSET_SERVICE_TOKEN_KEY:test_attachment_key}
specify-web-asset-service.tokenTimeToleranceSeconds=${SPECIFY_WEB_ASSET_SERVICE_TOKEN_TIME_TOLERANCE_SECONDS:150}
specify-web-asset-service.tokenRequiredForGet=${SPECIFY_WEB_ASSET_SERVICE_TOKEN_REQUIRED_FOR_GET:false}
specify-web-asset-service.institution=${SPECIFY_WEB_ASSET_SERVICE_INSTITUTION:NHMD}
asset-service.rootUrl=${ASSET_SERVICE_ROOT_URL:http://localhost:8084/ars}

specify.rootUrl=${SPECIFY_URL:https://specify-test3.science.ku.dk}
specify.assetServer=${SPECIFY_ASSET_SERVER:https://testify-media.science.ku.dk}
specify-mappings.location=${SPECIFY_MAPPINGS_LOCATION:C:/Users/Thomas/Documents/projects/specify-adapter/mappings/}
specify.username = ${SPECIFY_USERNAME}
specify.password = ${SPECIFY_PASSWORD}
institution-config-crypto.secretKey=${INSTITUTION_CONFIG_SECRET_KEY}

sync.specify-to-ars.cron=${SPECIFY_TO_ARS_SYNC_CRON:0 0 3 * * *}

keycloak.service-user.keycloakUrl=${auth.serverRootUrl}
keycloak.service-user.realm=${auth.keycloak.realm}
keycloak.service-user.clientId=${KEYCLOAK_AMQP_CLIENT_ID:rabbitmq-service-user}
keycloak.service-user.clientSecret=${KEYCLOAK_AMQP_CLIENT_SECRET:kbOFBXI9tANgKUq8vXHLhT6YhbivgXxn}

# Postgres datasource
datasource.jdbcUrl=${POSTGRES_URL:jdbc:postgresql://localhost:5434/dassco_bridge}
datasource.username=${POSTGRES_USER:dassco_bridge}
datasource.password=${POSTGRES_PASSWORD:dassco_bridge}
datasource.connectionTimeout=${POSTGRES_CONNECTION_TIMEOUT:30000}
datasource.idleTimeout=${POSTGRES_IDLE_TIMEOUT:600000}
datasource.maxLifetime=${POSTGRES_MAX_LIFETIME:1800000}
datasource.minimumIdle=${POSTGRES_MINIMUM_IDLE:2}
datasource.maximumPoolSize=${POSTGRES_MAXIMUM_POOL_SIZE:5}
datasource.schema=${POSTGRES_SCHEMA:public}

# Need to have an application-local.properties file with specify.username and specify.password!
spring.config.import=optional:file:./application-local.properties

# Liquibase
logging.level.liquibase=INFO
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/liquibase/changelog-master.xml
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:default}

management.info.env.enabled=true
management.endpoints.web.exposure.include=info,health
info.artifact=@project.artifactId@
info.version=@project.version@
info.buildTime=@maven.build.timestamp@


# The property names corresponds directly to the HTTP header names, with one additional trick:
# Allow-Origin can be a comma-separated list rather than a single origin.
cors.Access-Control-Allow-Origin=${CORS_ALLOW_ORIGIN: http://localhost:4200/, http://localhost:8084}
cors.Access-Control-Allow-Methods=GET, PUT, POST, DELETE, HEAD, OPTIONS
cors.Access-Control-Allow-Headers=Authorization, Accept, Origin, Content-Type, Cache-Control, If-None-Match
cors.Access-Control-Expose-Headers=Access-Control-Allow-Origin, ETag
cors.Access-Control-Max-Age=86400
